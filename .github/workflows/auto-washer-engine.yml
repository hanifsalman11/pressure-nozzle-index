name: Autonomous Pressure Washer Nozzle & Surface Cleaner Engine

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_washer:
        description: 'Optional Pressure Washer Model (e.g. Simpson PowerShot 4200 PSI 4.0 GPM)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-washer-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pressure Washer Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_WASHER: ${{ github.event.inputs.custom_washer || '' }}
        run: |
          python engine/washer_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_washers.json
          if git diff --staged --quiet; then
            echo "No new pressure washer calculator pages to commit."
          else
            git commit -m "chore(washer): auto-publish new pressure washer orifice & surface cleaner calculators"
            git push origin main
          fi
